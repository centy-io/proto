# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

# Day-one adoption: .proto files warn only, so CI reports the existing
# centy/v1/centy.proto monolith without blocking merges. Tighten to an
# `error` threshold once that file is split.
rules:
  - pattern: "**/*.proto"
    warn: 200
    warn_message: "Getting long — consider splitting these messages into their own .proto"

exclude:
  - "**/pnpm-lock.yaml"
  - "**/node_modules/**"
